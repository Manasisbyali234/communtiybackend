services:
  api:
    build:
      context: .
      target: runner
    image: ${BACKEND_IMAGE:-community-backend:latest}
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
    depends_on:
      - db
      - redis

  workers:
    build:
      context: .
      target: runner
    image: ${BACKEND_IMAGE:-community-backend:latest}
    restart: always
    command: ["node", "dist/workers/index.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    networks:
      default:
        aliases:
          - community_postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-community_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
