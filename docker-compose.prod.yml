services:
  api:
    build:
      context: .
      target: runner
    image: ${BACKEND_IMAGE:-community-backend:latest}
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
    depends_on:
      - redis

  workers:
    build:
      context: .
      target: runner
    image: ${BACKEND_IMAGE:-community-backend:latest}
    restart: always
    command: ["node", "dist/workers/index.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - redis

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
